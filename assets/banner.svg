<svg xmlns="http://www.w3.org/2000/svg" width="840" height="300" viewBox="0 0 840 300" role="img" aria-labelledby="title desc" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="title">Jose Luis Tot Herrera — Developer Space</title>
  <desc id="desc">Banner espacial orientado a la programación para un técnico en desarrollo de software, con planeta animado y símbolos de código.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10152e"/>
      <stop offset="0.55" stop-color="#0c1228"/>
      <stop offset="1" stop-color="#071b25"/>
    </linearGradient>
    <linearGradient id="planet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8ce9e2"/>
      <stop offset="0.35" stop-color="#31b7b0"/>
      <stop offset="0.72" stop-color="#147a88"/>
      <stop offset="1" stop-color="#172e5b"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8a9cff" stop-opacity=".12"/>
      <stop offset=".5" stop-color="#7be8e1" stop-opacity=".95"/>
      <stop offset="1" stop-color="#a6b5ff" stop-opacity=".2"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#35d8ce" stop-opacity=".3"/>
      <stop offset="1" stop-color="#35d8ce" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="planetClip"><circle cx="680" cy="151" r="66"/></clipPath>
    <filter id="softGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect x="1" y="1" width="838" height="298" rx="20" fill="url(#bg)" stroke="#30395f" stroke-width="1.5"/>
  <ellipse cx="680" cy="151" rx="150" ry="140" fill="url(#glow)"/>

  <!-- Subtle star field -->
  <g fill="#dbe8ff">
    <circle cx="335" cy="37" r="1.4" opacity=".7"/>
    <circle cx="520" cy="43" r="1.2" opacity=".55"/>
    <circle cx="790" cy="82" r="1.6" opacity=".8"/>
    <circle cx="570" cy="255" r="1.3" opacity=".6"/>
    <circle cx="760" cy="245" r="1.1" opacity=".6"/>
    <circle cx="455" cy="214" r="1.4" opacity=".5"/>
    <circle cx="42" cy="235" r="1.2" opacity=".55"/>
  </g>
  <g fill="#8ee9e0">
    <path d="M383 28l3 7 7 3-7 3-3 7-3-7-7-3 7-3z" opacity=".75"/>
    <path d="M789 167l2.5 6 6 2.5-6 2.5-2.5 6-2.5-6-6-2.5 6-2.5z" opacity=".8"/>
  </g>
  <g stroke="#52618c" stroke-width="1" stroke-dasharray="3 7" opacity=".35" fill="none">
    <path d="M290 15L480 270"/>
    <path d="M450 12L820 220"/>
  </g>

  <!-- Text block -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <text x="46" y="112" fill="#f2f4ff" font-size="36" font-weight="700">Jose Luis Tot Herrera</text>
    <text x="48" y="145" fill="#b8c6f5" font-size="18" font-weight="700">Técnico en Desarrollo de Software</text>
  </g>

  <!-- Personal focus line to balance the composition -->
  <g font-family="Arial, sans-serif">
    <circle cx="53" cy="174" r="3" fill="#68ded5"/>
    <text x="65" y="178" fill="#aab6d9" font-size="13" letter-spacing=".25">Desarrollo web</text>
    <circle cx="169" cy="174" r="2" fill="#68ded5" opacity=".8"/>
    <text x="181" y="178" fill="#aab6d9" font-size="13" letter-spacing=".25">Programación</text>
    <circle cx="285" cy="174" r="2" fill="#68ded5" opacity=".8"/>
    <text x="297" y="178" fill="#aab6d9" font-size="13" letter-spacing=".25">Bases de datos</text>
  </g>

  <g transform="translate(48 195)">
    <rect width="350" height="35" rx="10" fill="#20294a" stroke="#36436c"/>
    <text x="17" y="22" fill="#dce5ff" font-family="ui-monospace, monospace" font-size="13" font-weight="600">HTML · CSS · JavaScript · Python · MySQL</text>
  </g>
  <text x="48" y="266" fill="#7f8db8" font-family="Arial, sans-serif" font-size="13" letter-spacing=".5">Guatemala  |  Aprendiendo y construyendo cada día</text>

  <!-- Floating code symbols -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-weight="700">
    <text x="318" y="40" font-size="16" fill="#52618c" opacity="0.55">&lt;/&gt;<animateTransform attributeName="transform" type="translate" values="0 0;0 -5;0 0" dur="5s" repeatCount="indefinite"/></text>
    <text x="505" y="46" font-size="16" fill="#68ded5" opacity="0.5">{ }<animateTransform attributeName="transform" type="translate" values="0 0;0 5;0 0" dur="6s" repeatCount="indefinite"/></text>
    <text x="790" y="88" font-size="13" fill="#52618c" opacity="0.55">01<animateTransform attributeName="transform" type="translate" values="0 0;0 -4;0 0" dur="4s" repeatCount="indefinite"/></text>
    <text x="576" y="266" font-size="18" fill="#8ee9a8" opacity="0.5">;<animateTransform attributeName="transform" type="translate" values="0 0;0 4;0 0" dur="5s" repeatCount="indefinite"/></text>
    <text x="760" y="258" font-size="14" fill="#52618c" opacity="0.55">()<animateTransform attributeName="transform" type="translate" values="0 0;0 -5;0 0" dur="6s" repeatCount="indefinite"/></text>
    <text x="412" y="28" font-size="13" fill="#a6b5ff" opacity="0.45">=&gt;<animateTransform attributeName="transform" type="translate" values="0 0;0 4;0 0" dur="7s" repeatCount="indefinite"/></text>

  </g>

  <!-- Blinking cursor after the role -->
  <rect x="408" y="131" width="9" height="17" fill="#8ee9a8">
    <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;.5;.5;1;1" dur="1.1s" repeatCount="indefinite"/>
  </rect>

  <!-- Animated planet -->
  <g>
    <circle cx="680" cy="151" r="83" fill="none" stroke="#6de3db" stroke-opacity=".18" stroke-dasharray="2 6">
      <animateTransform attributeName="transform" type="rotate" from="0 680 151" to="360 680 151" dur="45s" repeatCount="indefinite"/>
    </circle>
    <ellipse cx="680" cy="164" rx="105" ry="29" fill="none" stroke="url(#ring)" stroke-width="7" opacity=".9" transform="rotate(-17 680 151)"/>
    <circle cx="680" cy="151" r="66" fill="url(#planet)" stroke="#9af5ec" stroke-width="1.5" filter="url(#softGlow)"/>
    <g clip-path="url(#planetClip)">
      <g fill="#0b526c" opacity=".55">
        <path d="M598 116l28-10 14 12-9 12-22 3z"/>
        <path d="M648 86l18 9-5 14-17 5-10-13z"/>
        <path d="M690 121l22-8 20 12-5 18-27 4z"/>
        <path d="M620 159l24-7 16 12-8 17-28 2z"/>
        <path d="M672 177l17-12 22 6 7 19-19 11-21-8z"/>
        <path d="M711 218l18-15 17 7-6 18-21 5z"/>
      </g>
      <g opacity=".65" fill="none" stroke="#a4fff2" stroke-width="2">
        <path d="M590 139q35-22 68-7t72-4">
          <animate attributeName="stroke-dashoffset" from="0" to="-180" dur="9s" repeatCount="indefinite"/>
        </path>
        <path d="M594 183q30-18 58-4t73-8" stroke-dasharray="14 8">
          <animate attributeName="stroke-dashoffset" from="0" to="180" dur="12s" repeatCount="indefinite"/>
        </path>
      </g>
    </g>
    <!-- ring foreground -->
    <path d="M580 183a105 29 0 0 0 200-38" fill="none" stroke="#7ce8e0" stroke-width="3" opacity=".8" transform="rotate(-17 680 151)"/>
    <circle cx="680" cy="151" r="72" fill="none" stroke="#b1fff4" stroke-opacity=".25"/>
  </g>

  <!-- Orbiting tech chips -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 680 151" to="360 680 151" dur="32s" repeatCount="indefinite"/>
    <g transform="translate(775 151)"><g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="32s" repeatCount="indefinite"/>
      <rect x="-20.0" y="-11" width="40" height="22" rx="7" fill="#20294a" stroke="#68ded5"/>
      <text y="4.5" text-anchor="middle" fill="#68ded5" font-size="12" font-weight="700">&lt;/&gt;</text>
    </g></g>
    <g transform="translate(680 246)"><g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="32s" repeatCount="indefinite"/>
      <rect x="-17.0" y="-11" width="34" height="22" rx="7" fill="#20294a" stroke="#c792ea"/>
      <text y="4.5" text-anchor="middle" fill="#c792ea" font-size="12" font-weight="700">{ }</text>
    </g></g>
    <g transform="translate(585 151)"><g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="32s" repeatCount="indefinite"/>
      <rect x="-16.0" y="-11" width="32" height="22" rx="7" fill="#20294a" stroke="#ffd36e"/>
      <text y="4.5" text-anchor="middle" fill="#ffd36e" font-size="12" font-weight="700">py</text>
    </g></g>
    <g transform="translate(680 56)"><g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="32s" repeatCount="indefinite"/>
      <rect x="-20.0" y="-11" width="40" height="22" rx="7" fill="#20294a" stroke="#8ee9a8"/>
      <text y="4.5" text-anchor="middle" fill="#8ee9a8" font-size="12" font-weight="700">SQL</text>
    </g></g>
    </g>
  </g>
</svg>
